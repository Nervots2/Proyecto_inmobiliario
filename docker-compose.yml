services:
  postgres_gis:
    image: postgis/postgis:17-3.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Límite estricto de RAM para evitar cuelgues
    ports:
      - "9200:9200"

  redis_cache:
    image: redis:alpine
    ports:
      - "6379:6379"
  
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
  
  trino:
    image: trinodb/trino:484
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      - minio
      - hive_metastore
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./config/trino/catalog/lake.properties:/etc/trino/catalog/lake.properties:ro
      - ./config/trino/catalog/delta.properties:/etc/trino/catalog/delta.properties:ro

      
    restart: unless-stopped

  hive_metastore:
    image: apache/hive:4.0.1
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres_gis:5432/hive_metastore
        -Djavax.jdo.option.ConnectionUserName=hive_user
        -Djavax.jdo.option.ConnectionPassword=${HIVE_DB_PASSWORD}
      HADOOP_OPTIONAL_TOOLS: hadoop-aws
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    networks:
      default:
        aliases:
          - hive-metastore 
    ports:
      - "127.0.0.1:9083:9083"
    volumes:
      - ./config/hive/jdbc/postgresql-42.7.5.jar:/opt/hive/lib/postgres.jar:ro
      - ./config/hive/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
    depends_on:
      - postgres_gis
    restart: unless-stopped


volumes:
  minio_data:
  postgres_data: